<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Omnio</title>
    <meta name="description" content="Secure checkout hand-off for Omnio, backed by the live commerce basket." />
    <meta name="shop-name" content="Omnio" />
    <meta name="pajulina-app-name" content="Omnio Storefront" />
    <meta name="pajulina-client-id" content="01a02835-dc8f-71f5-95f8-bb299856e504" />
    <meta name="pajulina-shop-id" content="15596" />
    <meta name="pajulina-shop-name" content="Omnio" />
    <meta name="pajulina-shop-domain" content="marko-5vMFPy7t.myselldone.com" />
    <meta name="pajulina-storefront-shop-handle" content="marko-5vMFPy7t" />
    <meta name="pajulina-dashboard-path" content="/dashboard/" />
    <meta name="pajulina-callback-path" content="/selldone-callback" />
    <meta name="pajulina-selldone-base" content="https://selldone.com" />
    <meta name="pajulina-api-base" content="https://api.selldone.com" />
    <meta name="pajulina-xapi-base" content="https://xapi.selldone.com" />
    <meta name="pajulina-auth-prompt" content="consent" />
    <meta content="https://xapi.selldone.com" name="selldone-xapi" />
    <meta content="https://cdn.selldone.com/app" name="selldone-cdn-images" />
    <link rel="preconnect" href="https://cdn.selldone.com" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="omnio.css" />
    <script type="module" src="app.js"></script>
    <script type="module" src="checkout-omnio.js"></script>
  </head>
  <body>

    <a class="skip" href="#main">Skip to content</a>

    <div class="page" style="margin-left:0">
      <!-- Platform credit. Sits above the shop's own announcement bar and is
           deliberately light: the announcement bar is dark, and two dark bars
           stacked read as one heavy block. Outside the sticky header, so the
           stuck-header height the sticky offsets depend on is unchanged. -->
      <div class="sdbar">
        <p class="sdbar__in"><svg class="sdbar__hx" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.7 4.4 13a4.8 4.8 0 0 1 6.8-6.8l.8.8.8-.8A4.8 4.8 0 1 1 19.6 13Z"/></svg><span class="sdbar__made">Made with</span><a href="https://selldone.com" rel="noopener">Selldone</a></p>
      </div>

      <header class="hdr omnio-header" data-shared-chrome="v3">
        <div class="topbar"><span class="topbar__long" data-announce-long>Free delivery over $35 · Easy 30-day returns</span><span class="topbar__short" data-announce-short>Free delivery over $35</span></div>
      
        <div class="omni-primary">
          <button class="omni-burger" type="button" data-open="nav" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      
          <a class="omni-logo" href="index.html" aria-label="Omnio home">omnio<i aria-hidden="true"></i></a>
      
          <a class="omni-deliver" href="shop.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
            <span><small>Deliver to</small><b data-brand-cities-line>Your area</b></span>
          </a>
      
          <form class="omni-search" role="search" data-search-form>
            <label class="sr" for="omni-q">Search Omnio</label>
            <button class="omni-search__scope" type="button" data-search-scope aria-label="Search department">All</button>
            <input id="omni-q" name="q" type="search" autocomplete="off" placeholder="Search Omnio" data-search-input>
            <button class="omni-search__go" type="submit" aria-label="Run search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg></button>
          </form>
      
          <div class="omni-acts">
            <button class="omni-act" type="button" data-open="account">
              <small>Hello, sign in</small><b>Account &amp; Lists</b>
            </button>
            <a class="omni-act omni-act--orders" href="account.html">
              <small>Returns</small><b>&amp; Orders</b>
            </a>
            <button class="omni-act omni-cart" type="button" data-open="cart" aria-label="Open bag, 0 items">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h3l2.4 11h9.3l2.3-8H7"/><circle cx="10" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/></svg>
              <span class="omni-cart__n" data-cart-count>0</span>
              <b>Bag</b>
            </button>
          </div>
        </div>
      
        <div class="omni-navrow">
          <nav class="omni-nav" aria-label="Main">
            <button class="omni-all" type="button" data-nav-panel="departments" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>All
            </button>
            <div class="omni-nav__links" data-nav-links></div>
          </nav>
          <div class="mega-overlay" data-mega-overlay></div>
          <div class="mega" aria-hidden="true"><div class="mega__grid" id="megagrid"></div></div>
        </div>
      </header>

      <main id="main" tabindex="-1" class="section co-page">
        <div class="wrap" id="ckroot"></div>
      </main>

      <footer class="ft ink" style="padding-top:56px">
        <div class="wrap">
          <div class="ft__bar" style="border-top:0;padding-top:0">
            <span>© 2026 Omnio</span>
            <span>Visa · Mastercard · Amex · Bank transfer</span>
          </div>
        </div>
      </footer>

    </div>
  </body>
</html>
